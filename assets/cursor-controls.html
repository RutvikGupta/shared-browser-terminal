<script id="shared-terminal-cursor-script">
(() => {
  // During a TUI redraw, tmux can expose the cursor at intermediate positions.
  // Keep those transients invisible without changing application output/input.
  const poll = setInterval(() => {
    const term = window.term;
    if (!term?.onWriteParsed) return;
    clearInterval(poll);
    let timer, originalCursor, hidden = false, typingUntil = 0;
    function show() {
      clearTimeout(timer);
      if (!hidden) return;
      term.options.theme = {...term.options.theme, cursor: originalCursor};
      hidden = false;
    }
    const output = term.onWriteParsed(() => {
      if (performance.now() < typingUntil) return;
      if (!hidden) {
        originalCursor = term.options.theme.cursor;
        term.options.theme = {...term.options.theme, cursor: '#00000000'};
        hidden = true;
      }
      clearTimeout(timer);
      timer = setTimeout(show, 180);
    });
    const input = term.onData(() => {
      typingUntil = performance.now() + 600;
      show();
    });
    window.addEventListener('pagehide', () => {
      clearTimeout(timer); output.dispose(); input.dispose();
    }, {once: true});
  }, 50);
  window.addEventListener('pagehide', () => clearInterval(poll), {once: true});
})();
</script>
