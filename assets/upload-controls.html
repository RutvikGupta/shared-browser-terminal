<style id="shared-terminal-upload-style">
.sbt-button { font: 600 13px system-ui, sans-serif; color: #faf9f6; background: #202a38; border: 1px solid #3780e9; border-radius: 8px; padding: 9px 14px; cursor: pointer; }
.sbt-button:hover { background: #2e5d9e; }
.sbt-button:focus-visible { outline: 2px solid #faf9f6; outline-offset: 3px; }
.sbt-button:disabled { opacity: .55; cursor: wait; }
#sbt-upload, #sbt-choose { position: fixed; right: 16px; top: 12px; z-index: 100; }
#sbt-dialog { box-sizing: border-box; width: min(780px, 94vw); max-height: 90vh; padding: 20px; border: 1px solid #566578; border-radius: 12px; background: #121212; color: #faf9f6; font: 14px system-ui, sans-serif; }
#sbt-dialog::backdrop { background: rgb(0 0 0 / 65%); }
#sbt-dialog header { display: flex; align-items: center; justify-content: space-between; gap: 16px; }
#sbt-dialog h2 { margin: 0; font-size: 19px; }
#sbt-dialog p { line-height: 1.5; color: #bfc5c3; }
#sbt-dialog iframe { display: block; width: 100%; height: min(340px, 50vh); border: 1px solid #292929; border-radius: 6px; margin-top: 16px; }
#sbt-dialog code { overflow-wrap: anywhere; }
</style>
<script id="shared-terminal-upload-script">
(() => {
  function setup() {
    const modes = new URL(location.href).searchParams.getAll('arg');
    const uploadMode = modes.length === 1 && modes[0] === 'upload';
    if (uploadMode) {
      const choose = document.createElement('button');
      choose.id = 'sbt-choose'; choose.className = 'sbt-button';
      choose.textContent = 'Connecting…'; choose.disabled = true;
      document.body.append(choose);
      let receiptHandler;
      const poll = setInterval(() => {
        const term = window.term;
        if (!term) return;
        if (!receiptHandler) receiptHandler = term.parser.registerOscHandler(777, data => {
          if (data === 'sbt-upload-failed') {
            choose.textContent = 'Upload ended';
            window.parent.postMessage({type: 'sbt-upload-state', state: 'failed'}, location.origin);
            return true;
          }
          const prefix = 'sbt-upload-complete;';
          if (!data.startsWith(prefix)) return false;
          try {
            const receipt = JSON.parse(atob(data.slice(prefix.length)));
            window.parent.postMessage({type: 'sbt-upload-complete', paths: receipt.paths}, location.origin);
          } catch { /* Invalid receipts never reach the main terminal input. */ }
          return true;
        });
        for (let i = 0; i < term.buffer.active.length; i++) {
          if (term.buffer.active.getLine(i)?.translateToString().includes('Ready to upload.')) {
            clearInterval(poll); choose.textContent = 'Choose files'; choose.disabled = false;
            window.parent.postMessage({type: 'sbt-upload-state', state: 'ready'}, location.origin);
            return;
          }
        }
      }, 100);
      window.addEventListener('pagehide', () => { clearInterval(poll); receiptHandler?.dispose(); }, {once: true});
      choose.addEventListener('click', () => {
        choose.disabled = true; choose.textContent = 'File selection opened';
        window.parent.postMessage({type: 'sbt-upload-state', state: 'started'}, location.origin);
        window.term.paste('\r');
      });
      return;
    }
    const upload = document.createElement('button');
    upload.id = 'sbt-upload'; upload.className = 'sbt-button';
    upload.textContent = '↑ Upload'; upload.setAttribute('aria-label', 'Upload documents');
    let focusTerminalOnClose = false, watchdog, connectionRetries = 0;
    const dialog = document.createElement('dialog');
    dialog.id = 'sbt-dialog'; dialog.setAttribute('aria-labelledby', 'sbt-upload-title');
    dialog.innerHTML = '<header><h2 id="sbt-upload-title">Upload documents</h2><button class="sbt-button" type="button" aria-label="Close upload dialog">Close</button></header><p>Click <strong>Choose files</strong> below. Files are saved on the hosting Mac in <code>~/Downloads/terminal-uploads/upload-…/</code>. Your agent keeps running.</p><p>Keep this dialog open until the terminal reports that the files were saved.</p><label><input id="sbt-insert-paths" type="checkbox" checked> Insert completed file paths into terminal input (without Enter)</label><p id="sbt-upload-result" role="status"></p><button id="sbt-retry-upload" class="sbt-button" type="button">Retry upload</button><p>Retry replaces only the upload connection and cancels any unfinished transfer. Your main terminal stays connected.</p>';
    document.body.append(upload, dialog);
    const result = dialog.querySelector('#sbt-upload-result');
    function startUpload() {
      clearTimeout(watchdog);
      dialog.querySelector('iframe')?.remove();
      result.textContent = connectionRetries ? 'Reconnecting upload…' : 'Connecting upload…';
      const frame = document.createElement('iframe');
      frame.title = 'Document upload terminal';
      const url = new URL(location.href); url.search = ''; url.hash = '';
      url.searchParams.set('arg', 'upload');
      url.searchParams.set('disableReconnect', 'true');
      url.searchParams.set('disableLeaveAlert', 'true');
      url.searchParams.set('disableResizeOverlay', 'true');
      url.searchParams.set('fontSize', '13');
      url.searchParams.set('titleFixed', 'Upload documents');
      frame.src = url.href;
      dialog.append(frame);
      watchdog = setTimeout(() => {
        if (!dialog.open || dialog.querySelector('iframe') !== frame || frame.dataset.state) return;
        if (connectionRetries++ === 0) startUpload();
        else result.textContent = 'Upload could not connect. Check your connection, then choose Retry upload.';
      }, 15000);
    }
    upload.addEventListener('click', () => {
      connectionRetries = 0;
      dialog.showModal(); startUpload();
    });
    dialog.querySelector('#sbt-retry-upload').addEventListener('click', () => {
      connectionRetries = 0; startUpload();
    });
    window.addEventListener('message', event => {
      const frame = dialog.querySelector('iframe');
      if (!dialog.open || event.origin !== location.origin || event.source !== frame?.contentWindow ||
          frame.dataset.completed) return;
      if (event.data?.type === 'sbt-upload-state') {
        const state = event.data.state;
        if (!['ready', 'started', 'failed'].includes(state)) return;
        // Ignore late readiness if selection/transfer has already started.
        if (state === 'ready' && frame.dataset.state) return;
        frame.dataset.state = state;
        clearTimeout(watchdog);
        if (state === 'ready') result.textContent = 'Connected. Choose files below.';
        if (state === 'failed') result.textContent = 'Upload canceled or failed. Choose Retry upload to try again.';
        if (state === 'started') {
          result.textContent = 'Select your files, then keep this dialog open until upload completes.';
          watchdog = setTimeout(() => {
            result.textContent = 'Still waiting for upload completion. If the picker or transfer is stuck, choose Retry upload.';
          }, 60000);
        }
        return;
      }
      if (event.data?.type !== 'sbt-upload-complete') return;
      const paths = event.data.paths;
      if (!Array.isArray(paths) || !paths.length || paths.some(path => typeof path !== 'string' ||
          !path.startsWith('/'))) return;
      clearTimeout(watchdog);
      if (paths.some(path => /[\x00-\x1f\x7f]/.test(path))) {
        frame.dataset.completed = 'true';
        dialog.querySelector('#sbt-upload-result').textContent = 'Uploaded, but paths containing control characters cannot be inserted automatically.';
        return;
      }
      frame.dataset.completed = 'true';
      result.textContent = 'Uploaded: ' + paths.join(', ');
      if (dialog.querySelector('#sbt-insert-paths').checked && window.term) {
        // Quote shell metacharacters and separate from existing input. Never
        // clear the composer or send a newline/Enter after inserting paths.
        const quoted = paths.map(path => "'" + path.replaceAll("'", "'\\''") + "'").join(' ');
        window.term.paste(' ' + quoted + ' ');
        focusTerminalOnClose = true; dialog.close();
      }
    });
    dialog.querySelector('button').addEventListener('click', () => dialog.close());
    dialog.addEventListener('close', () => {
      clearTimeout(watchdog);
      dialog.querySelector('iframe')?.remove();
      if (focusTerminalOnClose) window.term?.focus();
      else upload.focus();
      focusTerminalOnClose = false;
    });
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', setup, {once: true});
  else setup();
})();
</script>
