<style id="shared-terminal-upload-style">
.sbt-button { font: 600 13px system-ui, sans-serif; color: #faf9f6; background: #202a38; border: 1px solid #3780e9; border-radius: 8px; padding: 9px 14px; cursor: pointer; }
.sbt-button:hover { background: #2e5d9e; }
.sbt-button:focus-visible { outline: 2px solid #faf9f6; outline-offset: 3px; }
.sbt-button:disabled { opacity: .55; cursor: default; }
#sbt-upload { position: fixed; right: 16px; top: 12px; z-index: 100; }
#sbt-dialog { box-sizing: border-box; width: min(800px, 94vw); max-height: 90vh; overflow: auto; padding: 20px; border: 1px solid #566578; border-radius: 12px; background: #121212; color: #faf9f6; font: 14px system-ui, sans-serif; }
#sbt-dialog::backdrop { background: rgb(0 0 0 / 65%); }
#sbt-dialog header, .sbt-actions { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
#sbt-dialog h2 { margin: 0; font-size: 19px; }
#sbt-dialog p { line-height: 1.5; color: #bfc5c3; }
#sbt-dialog code { overflow-wrap: anywhere; }
#sbt-dialog select { font: inherit; color: inherit; background: #202a38; padding: 6px; }
#sbt-files { list-style: none; padding: 0; }
.sbt-file { padding: 12px 0; border-top: 1px solid #292929; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 6px 12px; }
.sbt-file strong, .sbt-file span { overflow-wrap: anywhere; }
.sbt-file progress { grid-column: 1; width: 100%; accent-color: #3780e9; }
.sbt-file .sbt-button { grid-column: 2; grid-row: 1 / span 3; align-self: center; }
.sbt-file code { grid-column: 1; font-size: 11px; color: #799c92; }
.sbt-file span { color: #bfc5c3; }
</style>
<script id="shared-terminal-upload-script">
(() => {
  function setup() {
    // Legacy upload URLs remain terminal receivers, without nesting another UI.
    if (new URL(location.href).searchParams.has('arg')) return;
    const upload = document.createElement('button');
    upload.id = 'sbt-upload'; upload.className = 'sbt-button';
    upload.textContent = '↑ Upload'; upload.setAttribute('aria-label', 'Upload documents');
    const dialog = document.createElement('dialog');
    dialog.id = 'sbt-dialog'; dialog.setAttribute('aria-labelledby', 'sbt-upload-title');
    dialog.innerHTML = '<header><h2 id="sbt-upload-title">Upload documents</h2><button class="sbt-button" type="button" aria-label="Close upload dialog">Close</button></header><p>Select multiple files with <strong>⌘-click</strong> on Mac, <strong>Ctrl-click</strong> on Windows/Linux, or <strong>Shift-click</strong> for a range. Files are saved under <code>~/Downloads/terminal-uploads/</code> on the hosting Mac.</p><div class="sbt-actions"><button id="sbt-choose" class="sbt-button" type="button">Choose files</button><label>Simultaneous uploads <select id="sbt-concurrency"><option>1</option><option>2</option><option selected>3</option></select></label><button id="sbt-retry-upload" class="sbt-button" type="button" disabled>Retry failed files</button></div><input id="sbt-file-input" type="file" multiple hidden><p><label><input id="sbt-insert-paths" type="checkbox" checked> Insert completed paths into terminal input when all files finish (without Enter)</label></p><p id="sbt-upload-result" role="status">Choose files to begin.</p><ul id="sbt-files" aria-label="Upload progress"></ul><p>Completed files stay listed. Closing cancels unfinished uploads; your terminal and agent keep running.</p>';
    document.body.append(upload, dialog);
    const result = dialog.querySelector('#sbt-upload-result'), list = dialog.querySelector('#sbt-files');
    const input = dialog.querySelector('#sbt-file-input'), retry = dialog.querySelector('#sbt-retry-upload');
    const concurrency = dialog.querySelector('#sbt-concurrency'), insert = dialog.querySelector('#sbt-insert-paths');
    const items = [];
    let active = 0;
    const bytes = number => number < 1024 ? number + ' B' : number < 1024 ** 2 ? (number / 1024).toFixed(1) + ' KB' : (number / 1024 ** 2).toFixed(1) + ' MB';
    function update() {
      const complete = items.filter(item => item.state === 'complete');
      const total = items.reduce((sum, item) => sum + item.file.size, 0);
      const received = items.reduce((sum, item) => sum + item.received, 0);
      for (const item of items) {
        item.row.dataset.state = item.state;
        item.savedPath.hidden = item.state !== 'complete';
        item.savedPath.textContent = item.path || '';
        item.progress.value = item.file.size ? item.received / item.file.size : item.state === 'complete' ? 1 : 0;
        item.status.textContent = (item.state === 'complete' ? 'Uploaded' : item.error || ({queued: 'Queued', connecting: 'Connecting', uploading: item.received === item.file.size ? 'Confirming save' : 'Uploading', canceled: 'Canceled'})[item.state]) + ' · ' + bytes(item.received) + ' / ' + bytes(item.file.size);
        item.button.hidden = item.state === 'complete';
        item.button.textContent = ['failed', 'canceled'].includes(item.state) ? 'Retry' : 'Cancel';
      }
      retry.disabled = !items.some(item => ['failed', 'canceled'].includes(item.state));
      if (!items.length) return;
      result.textContent = complete.length + ' of ' + items.length + ' files uploaded · ' + bytes(received) + ' / ' + bytes(total);
      if (complete.length === items.length && insert.checked && window.term) {
        const pending = complete.filter(item => !item.inserted);
        if (pending.length) {
          const quoted = pending.map(item => "'" + item.path.replaceAll("'", "'\\''") + "'").join(' ');
          window.term.paste(' ' + quoted + ' ');
          pending.forEach(item => { item.inserted = true; });
        }
        result.textContent += ' · Paths inserted. Close to return to your terminal.';
      }
    }
    function queue(item) {
      item.state = 'queued'; item.received = 0; item.error = ''; update(); schedule();
    }
    function cancel(item) {
      item.state = 'canceled'; item.error = ''; item.controller?.abort(); update();
    }
    function schedule() {
      if (!dialog.open) return;
      while (active < Number(concurrency.value)) {
        const item = items.find(item => item.state === 'queued' && !item.running);
        if (!item) break;
        item.running = true; active++; run(item);
      }
    }
    async function run(item) {
      const controller = new AbortController(); item.controller = controller;
      item.state = 'connecting'; update();
      try {
        for (let attempt = 0; ; attempt++) {
          try {
            item.path = await window.sharedTerminalUpload(item.file, {
              signal: controller.signal,
              onState: state => { item.state = state; update(); },
              onProgress: received => { item.received = received; update(); }
            });
            item.state = 'complete'; break;
          } catch (error) {
            if (controller.signal.aborted || !error.retryableConnection || attempt > 0) throw error;
          }
        }
      } catch (error) {
        // A Retry click can queue an aborted item before its promise settles.
        if (item.state !== 'queued') {
          item.state = controller.signal.aborted ? 'canceled' : 'failed';
          item.error = controller.signal.aborted ? '' : error.message;
        }
      } finally {
        item.running = false; active--; update(); schedule();
      }
    }
    upload.addEventListener('click', () => { dialog.showModal(); update(); schedule(); });
    dialog.querySelector('#sbt-choose').addEventListener('click', () => input.click());
    input.addEventListener('change', () => {
      for (const file of input.files) {
        const row = document.createElement('li'); row.className = 'sbt-file';
        const name = document.createElement('strong'); name.textContent = file.name;
        const progress = document.createElement('progress'); progress.max = 1; progress.value = 0; progress.setAttribute('aria-label', file.name + ' upload progress');
        const status = document.createElement('span'), button = document.createElement('button'), savedPath = document.createElement('code');
        savedPath.hidden = true;
        button.className = 'sbt-button'; button.type = 'button';
        const item = {file, row, progress, status, button, savedPath, state: 'queued', received: 0};
        button.addEventListener('click', () => ['failed', 'canceled'].includes(item.state) ? queue(item) : cancel(item));
        row.append(name, progress, status, button, savedPath); list.append(row); items.push(item);
      }
      input.value = ''; update(); schedule();
    });
    retry.addEventListener('click', () => {
      for (const item of items) if (['failed', 'canceled'].includes(item.state)) {
        item.state = 'queued'; item.received = 0; item.error = '';
      }
      update(); schedule();
    });
    concurrency.addEventListener('change', schedule); insert.addEventListener('change', update);
    dialog.querySelector('[aria-label="Close upload dialog"]').addEventListener('click', () => dialog.close());
    dialog.addEventListener('close', () => {
      for (const item of items) if (!['complete', 'failed', 'canceled'].includes(item.state)) cancel(item);
      window.term?.focus();
    });
    window.addEventListener('pagehide', () => { for (const item of items) item.controller?.abort(); });
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', setup, {once: true});
  else setup();
})();
</script>
