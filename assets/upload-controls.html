<style id="shared-terminal-upload-style">
.sbt-button { font: 600 13px system-ui, sans-serif; color: #faf9f6; background: #202a38; border: 1px solid #3780e9; border-radius: 8px; padding: 9px 16px; cursor: pointer; }
.sbt-button:hover { background: #2e5d9e; }
.sbt-button:focus-visible, .sbt-icon:focus-visible { outline: 2px solid #3780e9; outline-offset: 3px; }
#sbt-upload { position: fixed; right: 22px; top: 12px; z-index: 100; }
#sbt-dialog { box-sizing: border-box; width: min(640px, 94vw); max-height: 85vh; overflow: auto; padding: 24px; border: 1px solid #3a3a3a; border-radius: 14px; background: #161616; color: #faf9f6; font: 14px system-ui, sans-serif; }
#sbt-dialog::backdrop { background: rgb(0 0 0 / 60%); }
#sbt-dialog header, #sbt-dialog footer { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
#sbt-dialog h2 { margin: 0; font-size: 18px; font-weight: 600; }
.sbt-icon { border: 0; background: transparent; color: #aaa; font: 22px system-ui; cursor: pointer; padding: 4px 8px; }
.sbt-icon:hover { color: #fff; }
#sbt-drop { margin: 20px 0; padding: 30px 12px; border: 1px dashed #555; border-radius: 10px; text-align: center; }
#sbt-drop p { margin: 10px 0 0; color: #999; font-size: 13px; }
#sbt-drop.sbt-dragover { border-color: #3780e9; background: #202a38; }
#sbt-dialog.sbt-has-files #sbt-drop { padding: 14px; }
#sbt-files { list-style: none; padding: 0; margin: 0 0 20px; max-height: 45vh; overflow-y: auto; }
.sbt-file { padding: 16px 0; border-bottom: 1px solid #303030; display: grid; grid-template-columns: minmax(0, 1fr) 60px minmax(60px, 120px) 32px; align-items: center; gap: 12px; }
.sbt-file strong { font-size: 13px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sbt-size { color: #999; font-size: 12px; text-align: right; }
.sbt-file progress { width: 100%; height: 6px; accent-color: #3780e9; }
.sbt-file .sbt-state { color: #789b88; text-align: center; }
.sbt-file .sbt-error { grid-column: 1 / -1; color: #ae756f; font-size: 12px; }
#sbt-dialog footer { color: #aaa; font-size: 12px; }
#sbt-retry-paths, #sbt-retry-upload { border: 0; color: #6f9ee8; background: transparent; cursor: pointer; }
.sbt-sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); }
@media (max-width: 480px) { .sbt-file { grid-template-columns: minmax(0,1fr) 48px 65px 28px; gap: 7px; } }
</style>
<script id="shared-terminal-upload-script">
(() => {
  function setup() {
    // Legacy upload URLs remain terminal receivers, without nesting another UI.
    if (new URL(location.href).searchParams.has('arg')) return;
    const upload = document.createElement('button');
    upload.id = 'sbt-upload'; upload.className = 'sbt-button';
    upload.textContent = '↑ Upload'; upload.setAttribute('aria-label', 'Upload documents');
    const dialog = document.createElement('dialog');
    dialog.id = 'sbt-dialog'; dialog.setAttribute('aria-labelledby', 'sbt-upload-title');
    dialog.innerHTML = '<header><h2 id="sbt-upload-title">Upload</h2><button class="sbt-icon" type="button" aria-label="Close upload dialog">×</button></header><div id="sbt-drop"><button id="sbt-choose" class="sbt-button" type="button">Browse</button><p>or drop files here</p></div><input id="sbt-file-input" type="file" multiple hidden><ul id="sbt-files" aria-label="Upload progress"></ul><footer><label><input id="sbt-insert-paths" type="checkbox" checked> Insert paths</label><button id="sbt-retry-upload" type="button" hidden>Retry failed</button></footer><p id="sbt-path-error" role="alert" hidden></p><button id="sbt-retry-paths" type="button" hidden>Insert paths</button><p id="sbt-upload-result" class="sbt-sr-only" role="status"></p>';
    document.body.append(upload, dialog);
    const result = dialog.querySelector('#sbt-upload-result'), list = dialog.querySelector('#sbt-files');
    const input = dialog.querySelector('#sbt-file-input'), retry = dialog.querySelector('#sbt-retry-upload');
    const insert = dialog.querySelector('#sbt-insert-paths'), drop = dialog.querySelector('#sbt-drop');
    const items = [];
    let active = 0, lastCompletedCount = 0, finishing = false, insertionError = '';
    const pathError = dialog.querySelector('#sbt-path-error'), retryPaths = dialog.querySelector('#sbt-retry-paths');
    const bytes = number => number < 1024 ? number + ' B' : number < 1024 ** 2 ? (number / 1024).toFixed(1) + ' KB' : (number / 1024 ** 2).toFixed(1) + ' MB';
    function update() {
      const complete = items.filter(item => item.state === 'complete');
      dialog.classList.toggle('sbt-has-files', items.length > 0);
      for (const item of items) {
        item.row.dataset.state = item.state;
        item.progress.value = item.file.size ? item.received / item.file.size : item.state === 'complete' ? 1 : 0;
        item.status.textContent = item.state === 'complete' ? '✓' : '';
        item.status.hidden = item.state !== 'complete';
        item.status.setAttribute('aria-label', 'Uploaded');
        item.errorText.hidden = !item.error;
        item.errorText.textContent = item.error || '';
        item.button.hidden = item.state === 'complete';
        const canRetry = ['failed', 'canceled'].includes(item.state);
        item.button.textContent = canRetry ? '↻' : '×';
        item.button.setAttribute('aria-label', canRetry ? 'Retry' : 'Cancel');
        item.button.title = canRetry ? 'Retry' : 'Cancel';
      }
      retry.hidden = !items.some(item => ['failed', 'canceled'].includes(item.state));
      if (!items.length) return;
      result.textContent = complete.length + ' of ' + items.length + ' uploaded';
      pathError.hidden = retryPaths.hidden = !insertionError;
      pathError.textContent = insertionError;
      const settled = items.every(item => ['complete', 'failed', 'canceled'].includes(item.state));
      if (settled && complete.length > lastCompletedCount && dialog.open && !finishing && !insertionError) {
        finish(complete);
      }
    }
    async function finish(complete) {
      finishing = true;
      try {
        const pending = complete.filter(item => !item.inserted);
        if (insert.checked && pending.length) {
          // Await tmux leaving copy mode; otherwise it can swallow pasted paths.
          await window.sharedTerminalPrepareInput();
          if (!dialog.open) return;
          if (!window.term || window.term.options.disableStdin) {
            throw new Error('Terminal is reconnecting. Retry inserting paths.');
          }
          const quoted = pending.map(item => "'" + item.path.replaceAll("'", "'\\''") + "'").join(' ');
          window.term.paste(' ' + quoted + ' ');
          pending.forEach(item => { item.inserted = true; });
        }
        lastCompletedCount = complete.length;
        if (complete.length === items.length) dialog.close();
      } catch (error) {
        insertionError = error.message || 'Could not insert paths. Please retry.';
      } finally {
        finishing = false;
        if (dialog.open) update();
      }
    }
    function queue(item) {
      item.state = 'queued'; item.received = 0; item.error = ''; update(); schedule();
    }
    function cancel(item) {
      item.state = 'canceled'; item.error = ''; item.controller?.abort(); update();
    }
    function schedule() {
      if (!dialog.open) return;
      while (active < 3) {
        const item = items.find(item => item.state === 'queued' && !item.running);
        if (!item) break;
        item.running = true; active++; run(item);
      }
    }
    async function run(item) {
      const controller = new AbortController(); item.controller = controller;
      item.state = 'connecting'; update();
      try {
        for (let attempt = 0; ; attempt++) {
          try {
            item.path = await window.sharedTerminalUpload(item.file, {
              signal: controller.signal,
              onState: state => { item.state = state; update(); },
              onProgress: received => { item.received = received; update(); }
            });
            item.state = 'complete'; break;
          } catch (error) {
            if (controller.signal.aborted || !error.retryableConnection || attempt > 0) throw error;
          }
        }
      } catch (error) {
        // A Retry click can queue an aborted item before its promise settles.
        if (item.state !== 'queued') {
          item.state = controller.signal.aborted ? 'canceled' : 'failed';
          item.error = controller.signal.aborted ? '' : error.message;
        }
      } finally {
        item.running = false; active--; update(); schedule();
      }
    }
    upload.addEventListener('click', () => { dialog.showModal(); update(); schedule(); });
    dialog.querySelector('#sbt-choose').addEventListener('click', () => input.click());
    function addFiles(files) {
      for (const file of files) {
        const row = document.createElement('li'); row.className = 'sbt-file';
        const name = document.createElement('strong'); name.textContent = file.name; name.title = file.name;
        const progress = document.createElement('progress'); progress.max = 1; progress.value = 0; progress.setAttribute('aria-label', file.name + ' upload progress');
        const status = document.createElement('span'), button = document.createElement('button'), size = document.createElement('span'), errorText = document.createElement('span');
        status.className = 'sbt-state'; size.className = 'sbt-size'; size.textContent = bytes(file.size);
        errorText.className = 'sbt-error'; errorText.hidden = true;
        button.className = 'sbt-icon'; button.type = 'button';
        const item = {file, row, progress, status, button, errorText, state: 'queued', received: 0};
        button.addEventListener('click', () => ['failed', 'canceled'].includes(item.state) ? queue(item) : cancel(item));
        row.append(name, size, progress, button, status, errorText); list.append(row); items.push(item);
      }
      update(); schedule();
    }
    input.addEventListener('change', () => { addFiles(input.files); input.value = ''; });
    drop.addEventListener('dragover', event => { event.preventDefault(); event.stopPropagation(); drop.classList.add('sbt-dragover'); });
    drop.addEventListener('dragleave', () => drop.classList.remove('sbt-dragover'));
    drop.addEventListener('drop', event => {
      event.preventDefault(); event.stopPropagation(); drop.classList.remove('sbt-dragover');
      addFiles(event.dataTransfer.files);
    });
    retry.addEventListener('click', () => {
      for (const item of items) if (['failed', 'canceled'].includes(item.state)) {
        item.state = 'queued'; item.received = 0; item.error = '';
      }
      update(); schedule();
    });
    insert.addEventListener('change', () => { insertionError = ''; update(); });
    retryPaths.addEventListener('click', () => { insertionError = ''; update(); });
    dialog.querySelector('[aria-label="Close upload dialog"]').addEventListener('click', () => dialog.close());
    dialog.addEventListener('close', () => {
      for (const item of items) if (!['complete', 'failed', 'canceled'].includes(item.state)) cancel(item);
      window.term?.focus();
    });
    window.addEventListener('pagehide', () => { for (const item of items) item.controller?.abort(); });
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', setup, {once: true});
  else setup();
})();
</script>
