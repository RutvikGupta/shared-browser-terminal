<script id="shared-terminal-selection-script">
(() => {
  // Use xterm's public selection API. tmux mouse reporting otherwise consumes
  // drag selection and clears its highlight when its copy mode exits.
  let drag = null, selecting = false, selectionAnchor = null;
  function rememberAnchor(term, position) {
    selectionAnchor = {term, buffer: term.buffer.active, cols: term.cols, position};
  }
  const screenFor = term => term?.element?.querySelector('.xterm-screen');
  const focused = term => term?.element?.contains(document.activeElement);
  function updateSelection(action) {
    // ttyd's selection-change listener calls execCommand('copy'). Suppress only
    // those synchronous copies; explicit keyboard/menu copy still works.
    selecting = true;
    try { action(); } finally { selecting = false; }
  }
  function cell(term, screen, event) {
    const rect = screen.getBoundingClientRect();
    const column = Math.max(0, Math.min(term.cols, Math.floor((event.clientX - rect.left) * term.cols / rect.width)));
    const row = Math.max(0, Math.min(term.rows - 1, Math.floor((event.clientY - rect.top) * term.rows / rect.height)));
    return (term.buffer.active.viewportY + row) * term.cols + column;
  }
  function selectTo(event) {
    const {term, screen, anchor} = drag;
    const end = cell(term, screen, event);
    const first = Math.min(anchor, end);
    updateSelection(() => term.select(first % term.cols, Math.floor(first / term.cols), Math.abs(end - anchor)));
  }
  document.addEventListener('mousedown', event => {
    const term = window.term, screen = screenFor(term);
    if (event.button !== 0 || event.altKey || event.ctrlKey || event.metaKey || !screen?.contains(event.target)) return;
    event.preventDefault(); event.stopImmediatePropagation();
    term.focus();
    const previous = selectionAnchor;
    const extend = event.shiftKey && previous?.term === term && previous.buffer === term.buffer.active && previous.cols === term.cols;
    const anchor = extend ? previous.position : cell(term, screen, event);
    if (!extend) updateSelection(() => term.clearSelection());
    rememberAnchor(term, anchor);
    drag = {term, screen, anchor};
    if (extend) selectTo(event);
  }, true);
  document.addEventListener('mousemove', event => {
    if (!drag) return;
    if (!(event.buttons & 1)) { drag = null; return; }
    event.preventDefault(); event.stopImmediatePropagation();
    selectTo(event);
  }, true);
  document.addEventListener('mouseup', event => {
    if (!drag || event.button !== 0) return;
    event.preventDefault(); event.stopImmediatePropagation();
    selectTo(event); drag = null;
  }, true);
  function selectWord(term, screen, event) {
    const position = cell(term, screen, event);
    const buffer = term.buffer.active;
    let firstRow = Math.floor(position / term.cols), lastRow = firstRow;
    // Soft wraps belong to the same logical line; hard line breaks do not.
    while (firstRow > 0 && buffer.getLine(firstRow)?.isWrapped) firstRow--;
    while (buffer.getLine(lastRow + 1)?.isWrapped) lastRow++;
    const cells = [];
    for (let row = firstRow; row <= lastRow; row++) {
      const line = buffer.getLine(row);
      for (let column = 0; column < term.cols; column++) {
        const value = line?.getCell(column);
        if (!value || value.getWidth() === 0) continue;
        cells.push({start: row * term.cols + column, width: value.getWidth(), text: value.getChars()});
      }
    }
    let start = cells.findIndex(value => position >= value.start && position < value.start + value.width);
    if (start < 0) return;
    let end = start;
    const category = value => /^\s*$/u.test(value.text) ? 'space' :
      [...value.text].some(char => term.options.wordSeparator.includes(char)) ? 'separator' : 'word';
    const kind = category(cells[start]);
    if (kind !== 'separator') {
      while (start > 0 && category(cells[start - 1]) === kind) start--;
      while (end + 1 < cells.length && category(cells[end + 1]) === kind) end++;
    }
    const offset = cells[start].start;
    rememberAnchor(term, offset);
    updateSelection(() => term.select(offset % term.cols, Math.floor(offset / term.cols), cells[end].start + cells[end].width - offset));
  }
  function selectLine(term, screen, event) {
    const buffer = term.buffer.active;
    let first = Math.floor(cell(term, screen, event) / term.cols), last = first;
    while (first > 0 && buffer.getLine(first)?.isWrapped) first--;
    while (buffer.getLine(last + 1)?.isWrapped) last++;
    rememberAnchor(term, first * term.cols);
    updateSelection(() => term.select(0, first, (last - first + 1) * term.cols));
  }
  // xterm's normal click/word-selection handlers must not clear our selection.
  for (const type of ['click', 'dblclick']) {
    document.addEventListener(type, event => {
      if (event.button === 0 && !event.altKey && !event.ctrlKey && !event.metaKey && screenFor(window.term)?.contains(event.target)) {
        event.preventDefault(); event.stopImmediatePropagation();
        if (!event.shiftKey && type === 'click' && event.detail >= 3) {
          drag = null;
          selectLine(window.term, screenFor(window.term), event);
        } else if (!event.shiftKey && type === 'dblclick' && event.detail === 2) {
          drag = null;
          selectWord(window.term, screenFor(window.term), event);
        }
      }
    }, true);
  }
  window.addEventListener('blur', () => { drag = null; });
  document.addEventListener('copy', event => {
    if (selecting) {
      event.preventDefault(); event.stopImmediatePropagation();
      return;
    }
    const term = window.term;
    if (!focused(term) || !term.hasSelection() || !event.clipboardData) return;
    event.clipboardData.setData('text/plain', term.getSelection());
    event.preventDefault(); event.stopImmediatePropagation();
  }, true);
  document.addEventListener('keydown', event => {
    const term = window.term;
    const shortcut = event.key.toLowerCase() === 'c' && !event.altKey &&
      ((event.metaKey && !event.ctrlKey) || (event.ctrlKey && event.shiftKey && !event.metaKey));
    if (!shortcut || !focused(term) || !term.hasSelection()) return;
    event.preventDefault(); event.stopImmediatePropagation();
    const fallback = () => {
      if (!document.execCommand('copy')) alert('Copy was blocked by the browser. Allow clipboard access and try again.');
    };
    if (navigator.clipboard?.writeText) navigator.clipboard.writeText(term.getSelection()).catch(fallback);
    else fallback();
  }, true);
})();
</script>
